name: Build debug package

on:
  push:

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            reason=$(awk '
              /\* What went wrong:/ { capture = 1; next }
              capture && /^> / { sub(/^> /, ""); print; exit }
              capture && NF { print; exit }
            ' gradle-build.log)
            if [ -z "$reason" ]; then
              reason=$(awk '
                /FAILURE:/ { print; exit }
                /Exception|Error|error/ { print; exit }
              ' gradle-build.log)
            fi
            if [ -z "$reason" ]; then
              reason="Gradle build failed; see the build log for details."
            fi
            echo "::error title=Debug APK build failed::$reason"
            {
              echo "### Debug APK build failed"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: procon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
